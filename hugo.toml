baseURL = "https://www.ycr76.fr/"
title = "Yacht Club Rouen 76"
locale = "fr-FR"
defaultContentLanguage = "fr"
copyright = "© Yacht Club Rouen 76 — Association loi du 1er juillet 1901"
enableGitInfo = false
enableRobotsTXT = true
disableHugoGeneratorInject = true

[pagination]
pagerSize = 10

# Sortie additionnelle : flux RSS classique + fichier iCal pour l'agenda
[outputs]
home = ["HTML", "RSS", "calendrier"]
section = ["HTML", "RSS"]

[outputFormats]
[outputFormats.calendrier]
mediaType = "text/calendar"
isPlainText = true
baseName = "calendrier"
extension = "ics"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
codeFences = false

[permalinks]
# :filename = nom du fichier sans extension (dates incluses) : sûr, pas de collision
# ni de caractère interdit ; les anciennes URLs Drupal restent accessibles via aliases.
# sans permalink : /divers/x/, /documents/x/…
actualites = "/l-actualite/:filename/"
evenement = "/calendrier/:filename/"

[params]
description = "Yacht Club Rouen 76 — école de voile, compétition dériveur, base de plein air de Hénouville (Seine-Maritime)"
# Coordonnées pied de page
clubName = "Yacht Club Rouen 76"
clubAddress = "1444 chaussée Bertrand — Base de Plein Air d'Hénouville — 76840 Hénouville"
clubPhone = "+33235323404"
clubPhoneLabel = "02 35 32 34 04"
clubEmail = "contact@ycr76.fr"
facebook = "https://www.facebook.com/Ycr76/"
youtube = "https://www.youtube.com/@YCR76"
# Widgets
weathercloudUrl = "https://app.weathercloud.net/d9815420917?language=fr&units=nautical"
weathercloudSticker = "https://app.weathercloud.net/device/sticker/9815420917?language=fr&units=nautical"

