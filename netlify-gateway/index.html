<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Passerelle YCR76</title>
  <script src="/config.js"></script>
</head>
<body>
  <h1>Passerelle YCR76</h1>
  <p>Cette page gère les formulaires et la connexion au gestionnaire de contenu.</p>
  <p><a id="lien-admin" href="https://dev.ycr76.fr/admin/">Ouvrir le gestionnaire de contenu</a>.</p>

  <form name="contact" data-netlify="true" data-netlify-honeypot="bot-champ" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input type="hidden" name="bot-champ">
    <input type="hidden" name="nom">
    <input type="hidden" name="prenom">
    <input type="hidden" name="civilite">
    <input type="hidden" name="email">
    <input type="hidden" name="telephone">
    <input type="hidden" name="sujet">
    <input type="hidden" name="objet">
    <input type="hidden" name="message">
    <input type="hidden" name="etablissement">
    <input type="hidden" name="adresse">
    <input type="hidden" name="code_postal">
    <input type="hidden" name="ville">
    <input type="hidden" name="pays">
  </form>

  <script>
    (function () {
      var cible = (window.YCR_SITE_CIBLE || 'https://dev.ycr76.fr/').replace(/\/?$/, '/');
      var admin = cible + 'admin/';
      var lien = document.getElementById('lien-admin');

      if (lien) {
        lien.href = admin;
      }

      var jeton = window.location.hash ? window.location.hash.slice(1) : window.location.search.replace(/^\?/, '');
      if (/(?:[#&?])(?:invite_token|recovery_token|confirmation_token)=/.test(jeton)) {
        window.location.replace(admin + '?' + jeton);
      }
    }());
  </script>
</body>
</html>
