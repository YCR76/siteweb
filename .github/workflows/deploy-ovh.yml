# Déploiement du site statique vers l'hébergement OVH (staging dev.ycr76.fr).
# Déclenché à chaque push sur main (et manuellement).
# Secrets GitHub à créer : Settings > Secrets and variables > Actions > New repository secret
#   OVH_FTP_PASSWORD : mot de passe SFTP (jamais dans le dépôt)
# Le formulaire de contact reste servi par Netlify ; seul le site statique est envoyé ici.
name: Deploy OVH

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [planning-updated]
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: ovh-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Installer Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Installer les dépendances Python
        run: python -m pip install --upgrade pip openpyxl

      - name: Télécharger le classeur du planning
        run: curl -fsSL "https://docs.google.com/spreadsheets/d/e/2PACX-1vQH1aDY8iQ9UVSqe3RblNTxDIYnixm5DnjEsAPwv76PfVC48kyOYTkXrLJbgQiUHxRpVN0UKoLETkw6/pub?output=xlsx&t=${{ github.run_id }}" -o planning.xlsx

      - name: Importer les événements
        run: python -X utf8 tools/import_xlsx.py planning.xlsx --write

      - name: Construire le site
        run: hugo --gc --minify --cleanDestinationDir

      - name: Envoyer via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ftp.cluster110.hosting.ovh.net
          username: ycrjvlgq
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          port: 22
          local_path: "./public/*"
          remote_path: /home/ycrjvlgq/dev
          sftp_only: true
          delete_remote_files: true
