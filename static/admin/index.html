<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Gestionnaire de contenu - YCR76</title>
  <link rel="icon" href="/images/favicon.ico">
</head>
<body>
  <!-- Decap CMS auto-hébergé : authentification par Netlify Identity (e-mail + mot de passe) -->
  <script src="/vendor/netlify-identity.js"></script>
  <script>
    function initNetlifyIdentity() {
      if (window.netlifyIdentity) {
        window.netlifyIdentity.init({
          APIUrl: 'https://loquacious-mochi-773bfa.netlify.app/.netlify/identity'
        });
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initNetlifyIdentity);
    } else {
      initNetlifyIdentity();
    }
  </script>
  <script src="decap-cms.js"></script>
</body>
</html>
