# Configuration du CMS (Sveltia) pour le site YCR76
# Le directeur édite tout le contenu d'ici ; chaque publication crée un
# commit GitHub, et Netlify reconstruit le site automatiquement.
# Le dépôt GitHub sera complété lors de la mise en ligne (voir MODE D'EMPLOI).
site_url: https://www.ycr76.fr
logo_url: /images/logo.jpg

backend:
  # git-gateway = connexion via Netlify Identity (invitation par e-mail du directeur)
  name: git-gateway
  branch: main

media_folder: static/images/uploads
public_path: /images/uploads

locale: fr

collections:
  # Les ancres (^pageFields etc.) permettent de declarer les champs une seule fois.

  - name: accueil
    label: Accueil et rubriques principales
    files:
      - file: content/_index.md
        label: Page d'accueil
        name: accueil
        fields: &rootPage
          - label: Titre
            name: title
            widget: string
          - label: Contenu
            name: body
            widget: markdown
      - file: content/actualites/_index.md
        label: Rubrique Actualité (présentation)
        name: actualites-index
        fields: *rootPage
      - file: content/evenement/_index.md
        label: Rubrique Agenda (présentation)
        name: agenda-index
        fields: *rootPage

  - name: pages-principales
    label: Pages du site (hors rubriques)
    files:
      - file: content/contactez-nous.md
        label: Contactez-nous
        name: contactez-nous
        fields: &pageFields
          - label: Titre
            name: title
            widget: string
          - label: Résumé
            name: summary
            widget: string
            required: false
          - label: Contenu
            name: body
            widget: markdown
      - file: content/actualites/_index.md
        label: Rubrique Actualité (présentation)
        name: actualites-index
        fields: *pageFields
      - file: content/evenement/_index.md
        label: Rubrique Agenda (présentation)
        name: agenda-index
        fields: *pageFields
      - file: content/le-club/lactivite-deriveur.md
        label: L'activité dériveur
        name: lactivite-deriveur
        fields: *pageFields
      - file: content/le-club/organigramme.md
        label: Organigramme
        name: organigramme
        fields: *pageFields
      - file: content/le-club/tarifs.md
        label: Tarifs (le club)
        name: tarifs
        fields: *pageFields
      - file: content/le-club/don-club.md
        label: Don au club
        name: don-club
        fields: *pageFields
      - file: content/le-club/licence-ffvoile-adhesion-ligne.md
        label: Licence FFVoile - adhésion en ligne
        name: licence-ffvoile
        fields: *pageFields
      - file: content/competition/resultats.md
        label: Résultats des dernières régates
        name: resultats
        fields: *pageFields
      - file: content/competition/programme.md
        label: Programme des régates
        name: programme
        fields: *pageFields
      - file: content/activites/activite-multi-sports.md
        label: Activité multi-sports
        name: activite-multi-sports
        fields: *pageFields
      - file: content/politique-confidentialite.md
        label: Politique de confidentialité
        name: politique-confidentialite
        fields: *pageFields

  - name: evenements
    label: Agenda (événements)
    folder: content/evenement
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [startDate, title]
    fields:
      - label: Titre
        name: title
        widget: string
      - label: Catégorie
        name: categorie
        widget: select
        options: [Régate, Stage, Animation]
        default: Régate
      - label: Date de début
        name: startDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
      - label: Toute la journée ?
        name: allDay
        widget: boolean
        default: true
      - label: Classes de bateaux concernées
        name: classes
        widget: select
        multiple: true
        required: false
        options: [ILCA/Laser, Europe, 420/29er, O'pen Skiff, RS Feva, Optimist, Habitable, Club]
      - label: Date de fin (optionnelle)
        name: endDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
        required: false
      - label: Dates des séances (série récurrente)
        name: dates
        widget: list
        required: false
        field:
          label: Date
          name: date
          widget: datetime
          format: YYYY-MM-DD
          date_format: DD/MM/YYYY
          time_format: false
      - label: Grade (régate)
        name: grade
        widget: select
        options: [5C, 5B, 5A, 4, 3, 2]
        required: false
      - label: Club organisateur (régate)
        name: clubOrganisateur
        widget: string
        required: false
      - label: Déplacement club (régate)
        name: deplacementClub
        widget: boolean
        default: false
        required: false
      - label: Hébergement club (régate)
        name: hebergementClub
        widget: boolean
        default: false
        required: false
      - label: CO_ID FFVoile (régate)
        name: coId
        widget: string
        required: false
        hint: Identifiant de la compétition sur regates.ffvoile.fr (ex. 1003175)
      - label: URL d'inscription (régate)
        name: urlInscription
        widget: string
        required: false
        hint: Lien Inscrivoile (ex. https://inscrivoile.fr/inscrits.php?id_regate=...)
      - label: URL d'informations (régate)
        name: urlInfos
        widget: string
        required: false
        hint: Lien libre (site du club organisateur, avis de course...)
      - label: Résumé
        name: summary
        widget: string
        required: false
      - label: Description
        name: body
        widget: markdown
        required: false

  - name: actualites
    label: Actualités
    folder: content/actualites
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - label: Titre
        name: title
        widget: string
      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD HH:mm:ss
        date_format: DD/MM/YYYY
        time_format: HH:mm
      - label: Catégorie (optionnelle)
        name: categorie
        widget: string
        required: false
      - label: Résumé
        name: summary
        widget: string
        required: false
      - label: Contenu
        name: body
        widget: markdown

  - name: le-club
    label: Rubrique Le club
    folder: content/le-club
    create: true
    fields: *pageFields

  - name: stages
    label: Rubrique Stages
    folder: content/stages
    create: true
    fields: *pageFields

  - name: activites
    label: Rubrique Base de plein air
    folder: content/activites
    create: true
    fields: *pageFields

  - name: voile-loisir
    label: Rubrique Voile loisir
    folder: content/voile-loisir
    create: true
    fields: *pageFields

  - name: competition
    label: Rubrique Compétition
    folder: content/competition
    create: true
    fields: *pageFields

  - name: partenaires
    label: Partenaires
    folder: content/nos-partenaires
    create: true
    fields:
      - label: Titre
        name: title
        widget: string
      - label: Logo
        name: logo
        widget: image
        required: false
      - label: Site internet
        name: siteInternet
        widget: string
        required: false
      - label: Résumé
        name: summary
        widget: string
        required: false
      - label: Description
        name: body
        widget: markdown
        required: false

  - name: galerie
    label: Galerie de photos
    folder: content/galerie
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: Titre
        name: title
        widget: string
      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
      - label: Présentation
        name: summary
        widget: string
        required: false
      - label: Contenu (texte + photos)
        name: body
        widget: markdown
        required: false
