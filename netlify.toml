# Netlify ne sert plus le site complet : il reste passerelle pour les formulaires
# et l'authentification Netlify Identity / Git Gateway du CMS.

[build]
  publish = "netlify-gateway"
  command = "true"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify.toml netlify-gateway/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
