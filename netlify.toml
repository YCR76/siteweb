# Paramètres de déploiement Netlify pour le site YCR76 (Hugo)

[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.169.0"
  HUGO_ENABLEGITINFO = "false"

# Proxy NAS Synology Photos : rend l'API même-origin pour la galerie dynamique
# (sinon le navigateur bloque les appels vers nas.ycr76.fr:5001 par CORS).
[[redirects]]
  from = "/nasapi/*"
  to = "https://nas.ycr76.fr:5001/webapi/:splat"
  status = 200
  force = true

# Page d'administration du CMS : pas de cache (mise à jour immédiate)
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"

# Accueil : autoriser les images optimisées Netlify
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
