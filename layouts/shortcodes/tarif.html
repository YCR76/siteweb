{{- $ref := .Get "ref" -}}
{{- if not $ref -}}
<span class="tarif" data-legacy="true">{{ .Inner }}</span>
{{- else -}}
{{- $tarif := index hugo.Data.tarifs $ref -}}
{{- if not $tarif -}}
  {{- errorf "Tarif inconnu : %q" $ref -}}
{{- end -}}
<span class="tarif" data-ref="{{ $ref }}">{{ $tarif.affichage }}</span>
{{- end -}}
