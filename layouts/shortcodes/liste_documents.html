{{ $docs := where site.RegularPages "Type" "documents" }}
{{ $docs = sort $docs ".Date" "desc" }}
{{ with $docs }}
<ul class="documents">
{{ range . }}
  <li>
    {{ if .Date }}<time datetime="{{ dateFormat "2006-01-02" .Date }}">{{ dateFormat "02/01/2006" .Date }}</time> — {{ end }}
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
{{ end }}
</ul>
{{ else }}
<p>La documentation est en cours de mise à jour.</p>
{{ end }}
